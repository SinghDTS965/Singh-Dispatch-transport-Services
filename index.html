<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Singh Dispatch Transport Services | Freight Dispatch</title>

    <meta name="description" content="Singh Dispatch Transport Services provides professional freight dispatch support for owner-operators and trucking companies, including load sourcing, rate negotiation, broker communication, and administrative support.">

    <style>
        :root {
            --black: #080b0f;
            --dark: #0d1117;
            --dark-2: #141a21;
            --blue: #2563eb;
            --blue-light: #60a5fa;
            --white: #ffffff;
            --gray-100: #f4f6f8;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --green: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--gray-700);
            background: var(--white);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        img {
            max-width: 100%;
        }

        .container {
            width: min(1180px, 90%);
            margin: auto;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(8, 11, 15, 0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .header-inner {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            color: white;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: -0.3px;
        }

        .logo span {
            color: var(--blue-light);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        nav a {
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 700;
            transition: 0.2s;
        }

        nav a:hover {
            color: white;
        }

        .nav-button {
            background: var(--blue);
            color: white !important;
            padding: 11px 18px;
            border-radius: 6px;
        }

        .nav-button:hover {
            background: #1d4ed8;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            position: relative;
            min-height: 720px;
            display: flex;
            align-items: center;
            overflow: hidden;
            background:
                linear-gradient(
                    90deg,
                    rgba(5, 8, 12, 0.96) 0%,
                    rgba(5, 8, 12, 0.88) 48%,
                    rgba(5, 8, 12, 0.55) 100%
                ),
                url("Truck.png") center / cover no-repeat;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                transparent 65%,
                rgba(8,11,15,0.75)
            );
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 780px;
            padding: 90px 0;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #bfdbfe;
            border: 1px solid rgba(96,165,250,0.35);
            background: rgba(37,99,235,0.12);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(34,197,94,0.12);
        }

        .hero h1 {
            color: white;
            font-size: clamp(3rem, 7vw, 5.7rem);
            line-height: 0.98;
            letter-spacing: -3px;
            margin-bottom: 28px;
            font-weight: 900;
        }

        .hero h1 span {
            color: var(--blue-light);
        }

        .hero-text {
            color: #cbd5e1;
            max-width: 680px;
            font-size: 1.15rem;
            margin-bottom: 35px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 13px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 5px;
            font-size: 0.92rem;
            font-weight: 800;
            transition: 0.2s;
        }

        .button-primary {
            background: var(--blue);
            color: white;
        }

        .button-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .button-outline {
            border: 1px solid #64748b;
            color: white;
            background: rgba(255,255,255,0.03);
        }

        .button-outline:hover {
            background: white;
            color: var(--black);
        }

        /* =========================
           HERO STATS
        ========================= */

        .hero-bottom {
            position: absolute;
            z-index: 5;
            bottom: 0;
            left: 0;
            right: 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(5,8,12,0.7);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .stat {
            padding: 20px 25px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .stat:last-child {
            border-right: 0;
        }

        .stat strong {
            color: white;
            display: block;
            font-size: 0.95rem;
            margin-bottom: 3px;
        }

        .stat span {
            color: #94a3b8;
            font-size: 0.8rem;
        }

        /* =========================
           GENERAL
        ========================= */

        section {
            padding: 100px 0;
        }

        .section-label {
            color: var(--blue);
            font-size: 0.78rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.7px;
            margin-bottom: 12px;
        }

        .section-title {
            color: var(--black);
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            line-height: 1.08;
            letter-spacing: -1.5px;
            margin-bottom: 18px;
            font-weight: 900;
        }

        .section-description {
            color: var(--gray-500);
            max-width: 700px;
            font-size: 1.05rem;
        }

        .section-header {
            margin-bottom: 55px;
        }

        /* =========================
           WHO WE SERVE
        ========================= */

        #about {
            background: var(--gray-100);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 75px;
            align-items: center;
        }

        .about-image {
            width: 100%;
            height: 540px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 25px 25px 0 #dbeafe;
        }

        .about-content p {
            color: var(--gray-500);
            margin-bottom: 20px;
        }

        .feature-list {
            list-style: none;
            margin-top: 28px;
        }

        .feature-list li {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 14px;
            color: var(--dark);
            font-weight: 700;
        }

        .feature-list li::before {
            content: "✓";
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dbeafe;
            color: var(--blue);
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 900;
        }

        /* =========================
           SERVICES
        ========================= */

        #services {
            background: white;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--gray-200);
            border: 1px solid var(--gray-200);
        }

        .service {
            background: white;
            padding: 38px 32px;
            min-height: 280px;
            transition: 0.25s;
        }

        .service:hover {
            background: #f8fafc;
            transform: translateY(-4px);
        }

        .service-number {
            color: var(--blue);
            font-size: 0.75rem;
            font-weight: 900;
            margin-bottom: 30px;
        }

        .service h3 {
            color: var(--black);
            font-size: 1.25rem;
            margin-bottom: 12px;
        }

        .service p {
            color: var(--gray-500);
            font-size: 0.95rem;
        }

        /* =========================
           HOW IT WORKS
        ========================= */

        #process {
            background: var(--dark);
            color: white;
        }

        #process .section-title {
            color: white;
        }

        #process .section-description {
            color: #94a3b8;
        }

        .process-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            border-top: 1px solid #29313b;
        }

        .process-step {
            padding: 45px 35px 20px 0;
            margin-right: 35px;
            border-right: 1px solid #29313b;
        }

        .process-step:last-child {
            border-right: 0;
        }

        .process-number {
            color: var(--blue-light);
            font-size: 0.8rem;
            font-weight: 900;
            margin-bottom: 25px;
        }

        .process-step h3 {
            font-size: 1.35rem;
            margin-bottom: 12px;
        }

        .process-step p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* =========================
           WHY US
        ========================= */

        #why-us {
            background: var(--gray-100);
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

            background: white;
            padding: 32px;
            border: 1
